#config-version=FGT60E-6.4.2-FW-build1778-200924:opmode=0:vdom=0
# Fortinet FortiGate Firewall Configuration — Vulnerable Baseline
# NetGuard AI Sample Audit File

config system global
    set hostname "FortiGate-Perimeter-FW01"
    set admintimeout 480
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next
end

config system admin
    edit "admin"
        set password CleartextPassword123
        set accprofile "super_admin"
        set vdom "root"
    next
end

config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end

config vpn ipsec phase1-interface
    edit "S2S_IPSEC_TUNNEL"
        set interface "port1"
        set peertype any
        set proposal des-md5 3des-sha1
        set dhgrp 2
        set remote-gw 203.0.113.50
        set psksecret SuperSecretPskKey777
    next
end

config firewall policy
    edit 1
        set name "Allow_All_Ingress"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end

# Remote logging disabled, NTP disabled
