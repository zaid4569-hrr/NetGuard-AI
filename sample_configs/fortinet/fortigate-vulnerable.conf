# ==============================================================================
# NetGuard AI Synthetic Lab Configuration (Intentionally Vulnerable FortiGate)
# WARNING: FOR AUDIT SIMULATION ONLY — NOT FOR PRODUCTION USE
# ==============================================================================
#config-version=FGT60E-6.4.2:opmode=0
config system global
    set hostname "FortiGate-Lab-FW-01"
    set admintimeout 480
end

config system interface
    edit "port1"
        set mode static
        set ip 192.0.2.254 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
    edit "port2"
        set mode static
        set ip 10.0.10.1 255.255.255.0
        set allowaccess ping
    next
end

config system admin
    edit "admin"
        set password CleartextAdminPass999
    next
end

config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end

config firewall policy
    edit 1
        set name "Permit_All_Inbound"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
