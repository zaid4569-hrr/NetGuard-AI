! Cisco IOS-XE Switch Configuration — CIS Hardened Baseline
! NetGuard AI Sample Audit File
!
version 16.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname Cisco-Dist-Switch-02
!
enable algorithm-type sha256 secret 8 $8$qR2vLgM...HardenedHash99
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
no ip source-route
no ip finger
no service tcp-small-servers
no service udp-small-servers
no ip http server
ip http secure-server
!
username netadmin privilege 15 algorithm-type sha256 secret 8 $8$vB8k1...SecureAdminHash11
!
banner motd ^C
======================================================================
  AUTHORIZED ACCESS ONLY. ALL SESSIONS ARE MONITORED AND RECORDED.
======================================================================
^C
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-CORE
 switchport mode trunk
!
ntp authenticate
ntp authentication-key 1 md5 7 0822455D0A16
ntp trusted-key 1
ntp server 10.10.10.1 prefer
ntp server 10.10.10.2
!
logging on
logging host 10.10.10.50
logging trap informational
logging source-interface Loopback0
!
snmp-server group SOC_READ_GROUP v3 priv
snmp-server user snmpv3monitor SOC_READ_GROUP v3 auth sha StrongShaAuthPass123 priv aes 128 StrongAesPrivPass123
!
ip access-list standard MGMT_BASTION_FILTER
 permit 10.10.100.0 0.0.0.255
 deny any log
!
no cdp run
!
line con 0
 exec-timeout 5 0
 login authentication default
line vty 0 15
 access-class MGMT_BASTION_FILTER in
 exec-timeout 10 0
 login authentication default
 transport input ssh
!
end
