! ==============================================================================
! NetGuard AI Synthetic Lab Configuration (Hardened Cisco Baseline)
! WARNING: FOR AUDIT SIMULATION ONLY — NOT FOR PRODUCTION USE
! ==============================================================================
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname Cisco-Lab-Router-Secure
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$m0Q8H1Z8...StrongArgon2HashedSecret
!
aaa new-model
aaa authentication login default group radius local
!
no ip source-route
no ip finger
no service tcp-small-servers
no service udp-small-servers
!
username secops privilege 15 secret 9 $9$p9K2L1...HardenedSecOps
!
interface GigabitEthernet0/0
 description WAN-Hardened-Perimeter
 ip address 192.0.2.1 255.255.255.0
 ip verify unicast source reachable-via rx
 no ip directed-broadcast
 no ip proxy-arp
!
crypto ikev2 proposal HARDENED_IKE
 encryption aes-gcm-256
 prf sha384
 group 19
!
banner motd ^C
AUTHORIZED ACCESS ONLY — ALL SESSIONS ARE MONITORED AND AUDITED BY NETGUARD AI.
^C
!
ip access-list standard MGMT-HOSTS
 permit 10.10.100.0 0.0.0.255
!
logging buffered 64000 informational
logging trap informational
logging host 10.10.10.50
!
ntp server 10.10.10.1 prefer
ntp authenticate
ntp authentication-key 1 md5 7 $7$a1B2C3...
!
snmp-server group SECGROUP v3 priv
snmp-server user secadmin SECGROUP v3 auth sha256 StrongAuthPass priv aes 128 StrongPrivPass
!
line con 0
 exec-timeout 10 0
 transport input none
 logging synchronous
line aux 0
 transport input none
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 access-class MGMT-HOSTS in
!
end
